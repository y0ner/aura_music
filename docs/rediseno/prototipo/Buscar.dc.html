<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aura · Buscar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#030303}
a{color:#fff;text-decoration:none}a:hover{color:#fff}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input::placeholder{color:#AAAAAA}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #030303; color: #ffffff; font-family: Roboto, system-ui, sans-serif">

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column">

    <div style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px">
      <div style="flex: 1; height: 52px; border-radius: 26px; background: #212121; display: flex; align-items: center; padding: 0 4px; gap: 4px">
        <a href="Main.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
        </a>
        <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar en tu biblioteca</label>
        <input id="q" placeholder="Canciones, artistas, playlists…" value="{{ query }}" onChange="{{ onType }}" style="flex: 1; min-width: 0; height: 44px; background: none; border: 0; outline: none; color: #ffffff; font: 400 16px Roboto, sans-serif">
      </div>
      <button aria-label="Ordenar y filtrar resultados" style="width: 52px; height: 52px; border-radius: 50%; border: 0; background: #212121; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7"></path><path d="M4 10V3"></path><path d="M12 21v-9"></path><path d="M12 8V3"></path><path d="M20 21v-5"></path><path d="M20 12V3"></path><path d="M2 14h4"></path><path d="M10 8h4"></path><path d="M18 16h4"></path></svg>
      </button>
    </div>

    <h2 style="margin: 16px 16px 12px; font-size: 16px; font-weight: 500; color: #AAAAAA">Reproducido hace poco</h2>
    <div style="display: flex; gap: 12px; padding: 0 16px; overflow: hidden">
      <sc-for list="{{ recent }}" as="r" hint-placeholder-count="4">
        <a href="Reproductor.dc.html" style="width: 104px; flex: none; display: flex; flex-direction: column; gap: 8px">
          <img src="{{ r.img }}" alt="" style="width: 104px; height: 104px; border-radius: 8px; object-fit: cover; display: block">
          <span class="ell" style="font-size: 14px; font-weight: 500">{{ r.title }}</span>
        </a>
      </sc-for>
    </div>

    <ul style="list-style: none; margin: 16px 0 0; padding: 0">
      <sc-for list="{{ history }}" as="h" hint-placeholder-count="5">
        <li style="display: flex; align-items: center; height: 56px; padding: 0 4px 0 20px; gap: 20px">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg>
          <span class="ell" style="flex: 1; font-size: 16px">{{ h.q }}</span>
          <button aria-label="Completar búsqueda con {{ h.q }}" style="width: 48px; height: 48px; border: 0; background: none; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17V7h10"></path><path d="M17 17 7 7"></path></svg>
          </button>
        </li>
      </sc-for>
    </ul>

    <h2 style="margin: 16px 16px 12px; font-size: 16px; font-weight: 500; color: #AAAAAA">Explora tu música</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 0 16px">
      <a href="Playlist.dc.html" style="height: 112px; border-radius: 16px; background: #1C1C1C; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="{{ accent }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span style="font-size: 16px; font-weight: 500; line-height: 1.2">Recién añadidas</span>
      </a>
      <a href="Playlist.dc.html" style="height: 112px; border-radius: 16px; background: #1C1C1C; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="{{ accent }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 7-8.5 8.5-5-5L2 17"></path><path d="M16 7h6v6"></path></svg>
        <span style="font-size: 16px; font-weight: 500; line-height: 1.2">Más escuchadas</span>
      </a>
      <a href="Reproductor.dc.html" style="height: 112px; border-radius: 16px; background: #1C1C1C; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="{{ accent }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h10"></path><path d="M4 18h7"></path></svg>
        <span style="font-size: 16px; font-weight: 500; line-height: 1.2">Con letra</span>
      </a>
    </div>
  </div>

  <a href="Reproductor.dc.html" aria-label="Abrir reproductor: Coronamos" style="position: absolute; left: 0; right: 0; bottom: 72px; height: 64px; background: #1F1F1F; display: flex; align-items: center; gap: 12px; padding: 0 4px 0 12px; box-sizing: border-box">
    <span style="position: absolute; left: 0; top: 0; height: 2px; width: 100%; background: #3A3A3A" aria-hidden="true"></span>
    <span style="position: absolute; left: 0; top: 0; height: 2px; width: 38%; background: {{ accent }}" aria-hidden="true"></span>
    <img src="/_blob/12b2d474d815a59967247ceee1d7e204" alt="" style="width: 44px; height: 44px; border-radius: 4px; object-fit: cover; flex: none">
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <span class="ell" style="font-size: 16px; font-weight: 500">Coronamos</span>
      <span class="ell" style="font-size: 14px; color: #AAAAAA">Lito Kirino y Anuel AA</span>
    </span>
    <span style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="#ffffff"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </span>
    <span style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="#ffffff"><path d="M5 5.5v13l10-6.5z"></path><rect x="16.5" y="5.5" width="2.5" height="13" rx="1"></rect></svg>
    </span>
  </a>

  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #0F0F0F; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6.5v-6h-5v6H3z"></path></svg>
      <span style="font-size: 12px">Inicio</span>
    </a>
    <a href="Buscar.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="font-size: 12px; font-weight: 700">Buscar</span>
    </a>
    <a href="Biblioteca.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"></path></svg>
      <span style="font-size: 12px">Biblioteca</span>
    </a>
    <a href="Anadir.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 20h14"></path></svg>
      <span style="font-size: 12px">Añadir</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF3D7F","options":["#FF3D7F","#8B5CFF","#FF8A3D","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: '' };
  }
  renderVals() {
    return {
      accent: this.props.accent ?? '#FF3D7F',
      query: this.state.query,
      onType: (e) => this.setState({ query: e.target.value }),
      recent: [
        { img: '/_blob/bdebc9eff9e3f72e95ccee6c2874a43e', title: 'Si No Es Contigo' },
        { img: '/_blob/72c058f1bd2d7ecf53a7c5dc96085b4f', title: 'Call Out My Name' },
        { img: '/_blob/12b2d474d815a59967247ceee1d7e204', title: 'Coronamos' },
        { img: '/_blob/adb5d92a441f1e89bf660f0637b6755e', title: 'Estas Ganas' },
      ],
      history: [
        { q: 'anuel' },
        { q: 'the weeknd' },
        { q: 'remix' },
        { q: 'fuerza regida' },
        { q: 'trap clasico' },
      ],
    };
  }
}
</script>
</body>
</html>
