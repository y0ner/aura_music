<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aura · Música que te gustó</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#030303}
a{color:#fff;text-decoration:none}a:hover{color:#fff}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #030303; color: #ffffff; font-family: Roboto, system-ui, sans-serif">

  <div style="position: absolute; inset: 0 0 auto 0; height: 360px; background: linear-gradient(180deg, #6E3FD8 0%, #4A2470 38%, #1A0E24 72%, #030303 100%)" aria-hidden="true"></div>
  <div style="position: absolute; inset: 0 0 auto 0; height: 260px; background: radial-gradient(60% 70% at 85% 10%, rgba(255,61,127,0.45), rgba(255,61,127,0) 70%)" aria-hidden="true"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; padding: 12px 4px 0">
      <a href="Biblioteca.dc.html" aria-label="Volver" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
      </a>
      <button aria-label="Más opciones" style="width: 48px; height: 48px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 32px 16px 0">
      <span style="width: 64px; height: 64px; border-radius: 10px; flex: none; background: linear-gradient(140deg, #FF8A3D 0%, #FF3D7F 48%, #8B5CFF 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(30,10,40,0.5)" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="#ffffff"><path d="M2 21h3.5V10H2zM22 11.2c0-1.1-.9-2-2-2h-5.6l.9-4.3v-.3c0-.4-.2-.8-.4-1.1L13.8 2.4 7.6 8.6c-.4.4-.6.9-.6 1.4v9c0 1.1.9 2 2 2h8.7c.8 0 1.5-.5 1.8-1.2l2.4-6.3c.1-.2.1-.5.1-.7z"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <h1 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.3px; line-height: 1.2">Música que te gustó</h1>
        <span style="font-size: 14px; color: #E0D6F5">{{ count }}</span>
      </div>
    </div>

    <p style="margin: 16px 16px 0; font-size: 14px; line-height: 1.45; color: #E0D6F5">Lo que marques con Me gusta en Aura. Vive en tu dispositivo: sin cuenta y sin conexión.</p>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 0">
      <button aria-label="Añadir todo a la fila" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.14); color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h12"></path><path d="M3 12h12"></path><path d="M3 18h8"></path><path d="M19 13v8"></path><path d="M15 17h8"></path></svg>
      </button>
      <div style="display: flex; align-items: center; gap: 12px">
        <button aria-label="Aleatorio" style="width: 48px; height: 48px; border: 0; background: none; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="m4 4 5 5"></path></svg>
        </button>
        <a href="Reproductor.dc.html" aria-label="Reproducir" style="width: 64px; height: 64px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="#030303" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </a>
      </div>
    </div>

    <div style="display: flex; gap: 8px; padding: 16px 16px 8px; overflow: hidden">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
        <button onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.label }}</button>
      </sc-for>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0">
      <sc-for list="{{ songs }}" as="s" hint-placeholder-count="6">
        <li>
          <a href="Reproductor.dc.html" style="height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 4px 0 16px">
            <img src="{{ s.img }}" alt="" style="width: 48px; height: 48px; border-radius: 4px; object-fit: cover; flex: none">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span class="ell" style="font-size: 16px; font-weight: 500">{{ s.title }}</span>
              <span style="display: flex; align-items: center; gap: 6px; min-width: 0">
                <sc-if value="{{ s.e }}" hint-placeholder-val="{{ true }}">
                  <span style="flex: none; width: 16px; height: 16px; border-radius: 2px; background: #AAAAAA; color: #030303; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center" aria-label="Explícita">E</span>
                </sc-if>
                <span class="ell" style="font-size: 14px; color: #AAAAAA">{{ s.meta }}</span>
              </span>
            </span>
            <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
            </span>
          </a>
        </li>
      </sc-for>
    </ul>
  </div>

  <a href="Reproductor.dc.html" aria-label="Abrir reproductor: Coronamos" style="position: absolute; left: 0; right: 0; bottom: 72px; height: 64px; background: #1F1F1F; display: flex; align-items: center; gap: 12px; padding: 0 4px 0 12px; box-sizing: border-box">
    <span style="position: absolute; left: 0; top: 0; height: 2px; width: 100%; background: #3A3A3A" aria-hidden="true"></span>
    <span style="position: absolute; left: 0; top: 0; height: 2px; width: 38%; background: {{ accent }}" aria-hidden="true"></span>
    <img src="/_blob/12b2d474d815a59967247ceee1d7e204" alt="" style="width: 44px; height: 44px; border-radius: 4px; object-fit: cover; flex: none">
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <span class="ell" style="font-size: 16px; font-weight: 500">Coronamos</span>
      <span class="ell" style="font-size: 14px; color: #AAAAAA">Lito Kirino y Anuel AA</span>
    </span>
    <span style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="#ffffff"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </span>
    <span style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="#ffffff"><path d="M5 5.5v13l10-6.5z"></path><rect x="16.5" y="5.5" width="2.5" height="13" rx="1"></rect></svg>
    </span>
  </a>

  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #0F0F0F; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6.5v-6h-5v6H3z"></path></svg>
      <span style="font-size: 12px">Inicio</span>
    </a>
    <a href="Buscar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="font-size: 12px">Buscar</span>
    </a>
    <a href="Biblioteca.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"></path></svg>
      <span style="font-size: 12px; font-weight: 700">Biblioteca</span>
    </a>
    <a href="Anadir.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 20h14"></path></svg>
      <span style="font-size: 12px">Añadir</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF3D7F","options":["#FF3D7F","#8B5CFF","#FF8A3D","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { chip: 'all' };
  }
  renderVals() {
    const all = [
      { img: '/_blob/ce77d15f12bad09a51212d2ab35b0d55', title: 'PERO NO TE ENAMORES', meta: 'Fuerza Regida · 3:04', e: true, from: 'tlm' },
      { img: '/_blob/12b2d474d815a59967247ceee1d7e204', title: 'Coronamos', meta: 'Lito Kirino y Anuel AA · 3:08', e: true, from: 'tlm' },
      { img: '/_blob/2705dedb4abcfc0dfbcfa1ce9a0ad861', title: 'Tu Me Enamoraste (Remix)', meta: 'Almighty, Anuel AA, Bryant Myers y más · 5:09', e: false, from: 'tc' },
      { img: '/_blob/20b0e35b8cf39a683e0c8a4fb48079c3', title: 'Hoy', meta: 'Jamby El Favo · 2:41', e: true, from: 'tlm' },
      { img: '/_blob/37ffe2c2b0774b4ca275e0ad779c3e46', title: 'Un Dia En Mi Barrio (Remix)', meta: 'Tony Monta, Pirlo, Topboy TGR y DFM · 7:15', e: true, from: 'tlm' },
      { img: '/_blob/875ead378e8e6030beffc42f5841e2ba', title: 'Compa Chappie', meta: 'Skinny TLW · 2:26', e: true, from: 'tlm' },
    ];
    const opts = [
      { key: 'all', label: 'Todas' },
      { key: 'tlm', label: 'Trap Latino Malandro' },
      { key: 'tc', label: '#5 Trap Clasico 💥🥵' },
    ];
    const chips = opts.map((o) => ({
      label: o.label,
      pick: () => this.setState({ chip: o.key }),
      style: 'flex: none; height: 40px; padding: 0 14px; border-radius: 8px; border: 0; cursor: pointer; font: 500 14px Roboto, sans-serif; ' +
        (this.state.chip === o.key ? 'background: #ffffff; color: #030303' : 'background: #272727; color: #ffffff'),
    }));
    const songs = this.state.chip === 'all' ? all : all.filter((s) => s.from === this.state.chip);
    const n = all.length;
    return {
      accent: this.props.accent ?? '#FF3D7F',
      chips,
      songs,
      count: n === 1 ? '1 canción' : n + ' canciones',
    };
  }
}
</script>
</body>
</html>
