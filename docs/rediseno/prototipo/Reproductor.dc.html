<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aura · Reproductor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#030303}
a{color:#fff;text-decoration:none}a:hover{color:#fff}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #030303; color: #ffffff; font-family: Roboto, system-ui, sans-serif">

  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #5A4214 0%, #33250C 34%, #120D05 66%, #030303 100%)" aria-hidden="true"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 4px 0">
      <a href="Main.dc.html" aria-label="Minimizar reproductor" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </a>
      <div style="display: flex; padding: 4px; border-radius: 24px; background: rgba(0,0,0,0.35)">
        <button onClick="{{ showSong }}" aria-pressed="{{ songOn }}" style="{{ songStyle }}">Canción</button>
        <button onClick="{{ showLyrics }}" aria-pressed="{{ lyricsOn }}" style="{{ lyricsStyle }}">Letra</button>
      </div>
      <button aria-label="Más opciones" style="width: 48px; height: 48px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
      </button>
    </div>

    <div style="padding: 24px 24px 0; height: 342px; box-sizing: content-box">
      <sc-if value="{{ songOn }}" hint-placeholder-val="{{ true }}">
        <img src="/_blob/12b2d474d815a59967247ceee1d7e204" alt="Carátula de Coronamos" style="width: 342px; height: 342px; border-radius: 12px; object-fit: cover; display: block; box-shadow: 0 24px 48px rgba(10,6,0,0.6)">
      </sc-if>
      <sc-if value="{{ lyricsOn }}" hint-placeholder-val="{{ false }}">
        <div style="width: 342px; height: 342px; display: flex; flex-direction: column; justify-content: center; gap: 16px">
          <p style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 22px; line-height: 1.3; color: rgba(255,255,255,0.4)">[Verso anterior]</p>
          <p style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 22px; line-height: 1.3; color: rgba(255,255,255,0.4)">[Verso anterior]</p>
          <p style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 22px; line-height: 1.3; color: #ffffff">[Verso que suena ahora, resaltado]</p>
          <p style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 22px; line-height: 1.3; color: rgba(255,255,255,0.4)">[Siguiente verso]</p>
          <p style="margin: 8px 0 0; font-size: 12px; color: rgba(255,255,255,0.7)">Letra sincronizada · LRCLIB · se guarda junto a la canción</p>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 24px 16px 0 24px">
      <div style="min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <h1 class="ell" style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.3px">Coronamos</h1>
        <span class="ell" style="font-size: 16px; color: rgba(255,255,255,0.75)">Lito Kirino y Anuel AA</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; padding: 16px 24px 0; overflow: hidden">
      <button onClick="{{ toggleLike }}" aria-pressed="{{ liked }}" style="flex: none; height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: rgba(255,255,255,0.12); color: #ffffff; display: flex; align-items: center; gap: 8px; font: 500 14px Roboto, sans-serif; cursor: pointer">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="{{ likeFill }}" stroke="{{ likeStroke }}" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M2 21h3.5V10H2zM22 11.2c0-1.1-.9-2-2-2h-5.6l.9-4.3v-.3c0-.4-.2-.8-.4-1.1L13.8 2.4 7.6 8.6c-.4.4-.6.9-.6 1.4v9c0 1.1.9 2 2 2h8.7c.8 0 1.5-.5 1.8-1.2l2.4-6.3c.1-.2.1-.5.1-.7z"></path></svg>
        Me gusta
      </button>
      <button style="flex: none; height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: rgba(255,255,255,0.12); color: #ffffff; display: flex; align-items: center; gap: 8px; font: 500 14px Roboto, sans-serif; cursor: pointer">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h12"></path><path d="M3 12h12"></path><path d="M3 18h8"></path><path d="M19 13v8"></path><path d="M15 17h8"></path></svg>
        Guardar
      </button>
      <button style="flex: none; height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: rgba(255,255,255,0.12); color: #ffffff; display: flex; align-items: center; gap: 8px; font: 500 14px Roboto, sans-serif; cursor: pointer">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
        Temporizador
      </button>
    </div>

    <div style="padding: 24px 24px 0">
      <div style="position: relative; height: 24px; display: flex; align-items: center">
        <span style="position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25)" aria-hidden="true"></span>
        <span style="position: absolute; left: 0; width: 38%; height: 4px; border-radius: 2px; background: {{ accent }}" aria-hidden="true"></span>
        <span style="position: absolute; left: calc(38% - 7px); width: 14px; height: 14px; border-radius: 50%; background: #ffffff" aria-hidden="true"></span>
        <input type="range" min="0" max="188" value="71" aria-label="Posición de la canción" aria-valuetext="1:11 de 3:08" style="position: absolute; inset: 0; width: 100%; height: 24px; margin: 0; opacity: 0; cursor: pointer">
      </div>
      <div style="display: flex; justify-content: space-between; padding-top: 6px; font-size: 12px; color: rgba(255,255,255,0.75)">
        <span>1:11</span><span>3:08</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0">
      <button aria-label="Aleatorio" style="width: 48px; height: 48px; border: 0; background: none; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="m4 4 5 5"></path></svg>
      </button>
      <button aria-label="Anterior" style="width: 56px; height: 56px; border: 0; background: none; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="M19 5.5v13L9 12z"></path><rect x="5" y="5.5" width="2.5" height="13" rx="1"></rect></svg>
      </button>
      <button onClick="{{ togglePlay }}" aria-label="{{ playLabel }}" style="width: 76px; height: 76px; border-radius: 50%; border: 0; background: #ffffff; color: #030303; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{ playing }}" hint-placeholder-val="{{ true }}">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
        </sc-if>
        <sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </sc-if>
      </button>
      <button aria-label="Siguiente" style="width: 56px; height: 56px; border: 0; background: none; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="M5 5.5v13L15 12z"></path><rect x="16.5" y="5.5" width="2.5" height="13" rx="1"></rect></svg>
      </button>
      <button aria-label="Repetir" style="width: 48px; height: 48px; border: 0; background: none; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>
      </button>
    </div>
  </div>

  <nav aria-label="Más sobre la canción" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: 8px; box-sizing: border-box">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <button aria-pressed="{{ t.on }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF3D7F","options":["#FF3D7F","#8B5CFF","#FF8A3D","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'song', playing: true, liked: true, tab: 0 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#FF3D7F';
    const seg = (on) => 'height: 36px; padding: 0 16px; border-radius: 18px; border: 0; cursor: pointer; font: 500 14px Roboto, sans-serif; ' +
      (on ? 'background: rgba(255,255,255,0.2); color: #ffffff' : 'background: none; color: rgba(255,255,255,0.75)');
    const songOn = this.state.mode === 'song';
    const tabs = ['A continuación', 'Letra', 'Relacionado'].map((label, i) => {
      const on = this.state.tab === i;
      return {
        label,
        on,
        pick: () => this.setState({ tab: i, mode: i === 1 ? 'lyrics' : this.state.mode }),
        style: 'height: 56px; border: 0; background: none; cursor: pointer; font: 500 14px Roboto, sans-serif; ' +
          (on ? 'color: #ffffff' : 'color: rgba(255,255,255,0.7)'),
      };
    });
    return {
      accent,
      songOn,
      lyricsOn: !songOn,
      songStyle: seg(songOn),
      lyricsStyle: seg(!songOn),
      showSong: () => this.setState({ mode: 'song' }),
      showLyrics: () => this.setState({ mode: 'lyrics' }),
      playing: this.state.playing,
      paused: !this.state.playing,
      playLabel: this.state.playing ? 'Pausar' : 'Reproducir',
      togglePlay: () => this.setState({ playing: !this.state.playing }),
      liked: this.state.liked,
      likeFill: this.state.liked ? '#ffffff' : 'none',
      likeStroke: '#ffffff',
      toggleLike: () => this.setState({ liked: !this.state.liked }),
      tabs,
    };
  }
}
</script>
</body>
</html>
